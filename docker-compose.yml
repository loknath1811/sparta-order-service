services:
  postgres:
    image: postgres:16
    container_name: order-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_service

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d order_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: order-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      - "9092:9092"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: order-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_service
      DB_USERNAME: order_service
      DB_PASSWORD: order_service
      EUREKA_URL: ${EUREKA_URL:-http://host.docker.internal:8761/eureka/}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres_data:
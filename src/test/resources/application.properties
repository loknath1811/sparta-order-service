# =====================================================================
# Test configuration
# ---------------------------------------------------------------------
# Uses an in-memory H2 database (PostgreSQL compatibility mode) so tests
# such as the @SpringBootTest context-load run without a live PostgreSQL.
# Hibernate builds the schema from the entities; the production Flyway
# migrations are PostgreSQL-specific and are disabled here.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:orderservice;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Kafka topic auto-creation isn't needed in tests and would otherwise retry
# against a non-existent broker for the full default timeout on context startup.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=1000
spring.kafka.admin.properties.default.api.timeout.ms=1000
spring.kafka.admin.properties.retries=0
kafka.topic.order-events=order-events
